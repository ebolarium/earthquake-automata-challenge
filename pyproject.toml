[build-system]
requires = ["setuptools>=72", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "earthquake-automata-challenge"
version = "0.1.0"
description = "Reproducible ETAS baseline and earthquake forecast challenge"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
# The historical ETAS package has conflicting Python metadata. The complete
# reference environment is installed only by docker/reference.Dockerfile.
reference = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.15.1",
]
evaluation = [
  "pycsep==0.6.3",
]

[tool.setuptools.packages.find]
where = ["src"]
