name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install ".[prospective]"
      - name: Verify locked prospective protocol
        run: python scripts/verify_prospective_protocol.py
      - name: Check browser scripts
        run: |
          node --check prospective_web/static/app.js
          node --check prospective_web/static/app-en.js
      - name: Run tests
        run: python -m unittest discover -s tests
